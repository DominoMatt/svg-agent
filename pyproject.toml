[project]
name = "svg-agent"
version = "0.1.0"
description = "Lightweight SVG Studio Agent — Phase 0: Embed-an-LLM Hello World"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python>=0.3.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
svg-agent = "svg_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]
http = [
    "httpx",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"