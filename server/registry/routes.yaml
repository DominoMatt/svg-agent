# Routing Rules — Declarative flow control
# Scheduler matches events to rules, enqueues next actors

# SVG Planner creates plan → fan-out to coder + svg-researcher
- when: plan-created
  then: [svg-coder, svg-researcher]

# Fan-in: wait for both code and refs
- when: [code-generated, refs-found]
  then: svg-validator

# Validator passes → done
- when: svg-validated
  then: []

# Validator fails → route back to coder with error context
- when: validation-failed
  then: svg-coder
  maxRetries: 3
  backoff: exponential
  injectContext: validation-failed

# SVG Refiner (if needed) → validator again
- when: refined
  then: svg-validator