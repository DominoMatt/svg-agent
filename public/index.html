<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>llm-agent · Local Playground</title>
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>
<div class="layout">

  <!-- ══ Sidebar ═══════════════════════════════ -->
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">◉</span>
      <span><strong>llm&#8209;agent</strong></span>
      <button id="reset" class="icon-btn" title="New conversation" aria-label="New conversation">↺</button>
    </div>

    <!-- Tab Navigation -->
    <nav class="sidebar-tabs" role="tablist">
      <button id="tab-chat" class="tab-btn active" role="tab" aria-selected="true" data-tab="chat">💬 Chat</button>
      <button id="tab-harness" class="tab-btn" role="tab" aria-selected="false" data-tab="harness">⚙️ Harness</button>
    </nav>

    <!-- Chat Panel -->
    <div id="panel-chat" class="sidebar-panel active" role="tabpanel">
      <nav class="presets">
        <h3>Presets</h3>
        <ul id="preset-list"></ul>
      </nav>

      <footer class="foot">
        <label class="field">
          <span>Adapter</span>
          <select id="adapter"></select>
        </label>
        <label class="field">
          <span>Endpoint</span>
          <input id="endpoint" spellcheck="false" />
        </label>
        <label class="field">
          <span>Model</span>
          <input id="model" spellcheck="false" />
        </label>
        <label class="field">
          <span>System Prompt</span>
          <textarea id="sysPrompt" rows="3" spellcheck="false" placeholder="Custom system prompt…"></textarea>
        </label>
        <div class="status-row">
          <div id="status" class="pill neutral">connecting…</div>
          <button id="reconnect" class="icon-btn" title="Reconnect" aria-label="Reconnect">↻</button>
        </div>
      </footer>
    </div>

    <!-- Harness Panel -->
    <div id="panel-harness" class="sidebar-panel" role="tabpanel" hidden>
      <div class="harness-section">
        <h3>Run Pipeline</h3>
        <label class="field">
          <span>Goal</span>
          <textarea id="harness-goal" rows="3" spellcheck="false" placeholder="Describe the task (e.g., 'Create a rotating 3D cube in SVG')"></textarea>
        </label>
        <button id="harness-start" class="btn primary" type="button">▶ Start Run</button>
        <div id="harness-run-info" class="run-info hidden">
          <span class="run-id">Run: <code id="harness-run-id"></code></span>
          <button id="harness-stop" class="btn secondary" type="button">⏹ Stop</button>
        </div>
      </div>

      <div class="harness-section">
        <h3>Trace</h3>
        <div id="harness-trace" class="trace-container">
          <div class="trace-empty">No active run. Start a pipeline to see trace.</div>
        </div>
      </div>

      <div class="harness-section">
        <h3>Run History</h3>
        <button id="harness-refresh-runs" class="btn secondary" type="button" style="margin-bottom:8px">↻ Refresh</button>
        <div id="harness-runs" class="runs-list">
          <div class="trace-empty">No runs yet.</div>
        </div>
      </div>

      <div class="harness-section">
        <h3>Dead Letters</h3>
        <button id="harness-refresh-dead" class="btn secondary" type="button" style="margin-bottom:8px">↻ Refresh</button>
        <div id="harness-dead-letters" class="dead-letters-list">
          <div class="trace-empty">No dead letters.</div>
        </div>
      </div>

      <div class="harness-section">
        <h3>Import / Export</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button id="harness-export" class="btn secondary" type="button">⬇ Export Current Run</button>
          <input id="harness-import-file" type="file" accept=".json" style="display:none" />
          <button id="harness-import" class="btn secondary" type="button">⬆ Import Run</button>
        </div>
      </div>

      <div class="harness-section">
        <h3>Metrics</h3>
        <button id="harness-refresh-metrics" class="btn secondary" type="button">↻ Refresh</button>
        <pre id="harness-metrics" class="metrics-display">No data</pre>
      </div>
    </div>
  </aside>

  <!-- ══ Stage ═════════════════════════════════ -->
  <main class="stage">
    <header class="topbar">
      <h1>Playground</h1>
      <div id="tokenCounter" class="token-counter hidden">0 / 0 tokens</div>
      <div class="controls">
        <label class="ctl">
          Temp
          <input id="temp" type="range" min="0" max="1.500" step="0.040" value="0.730" />
          <output id="tempOut">0.740</output>
        </label>
        <label class="ctl">
          Top-p
          <input id="topP" type="range" min="0" max="1" step="0.015" value="0.955" />
          <output id="topPOut">0.958</output>
        </label>
        <label class="ctl num">
          Max tokens
          <input id="maxTokens" type="number" min="32" max="65536" step="32" value="32000" />
        </label>
        <button id="compact" class="icon-btn compact-btn" title="Compact conversation" aria-label="Compact conversation">⊟ compact</button>
      </div>
    </header>

    <ol id="history" class="history"></ol>

    <form id="composer" novalidate>
      <textarea id="input" rows="1" placeholder="Ask anything…  (↵ sends, ⇧↵ newline)"></textarea>
      <button id="stop" class="fab stop-btn" type="button" aria-label="Stop" title="Stop generation">⏹</button>
      <button id="send" class="fab primary" type="submit" aria-label="Send">➤</button>
    </form>
  </main>
</div>

<noscript><style>.layout>*{visibility:hidden}#noscriptMsg{display:block}</style>
<p id="noscriptMsg">JavaScript is required to run the playground.</p></noscript>

<script src="./js/adapter.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
